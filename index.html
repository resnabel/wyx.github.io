<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Security Center</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Microsoft YaHei",Arial;
}


body{

height:100vh;

background:#050505;

color:#00ff66;

display:flex;

justify-content:center;

align-items:center;

}


.box{

width:90%;

max-width:420px;

background:#111;

padding:35px;

border-radius:12px;

border:1px solid #00ff66;

box-shadow:0 0 25px rgba(0,255,100,.4);

text-align:center;

}



h1{

font-size:26px;

margin-bottom:25px;

}



p{

margin:15px 0;

line-height:1.8;

}



input{

width:100%;

padding:14px;

background:#000;

color:#00ff66;

border:1px solid #00ff66;

font-size:18px;

border-radius:5px;

}



button{

margin-top:20px;

width:100%;

padding:14px;

font-size:18px;

background:#00ff66;

border:none;

border-radius:5px;

cursor:pointer;

}



#result{

display:none;

}



.loader{

width:45px;

height:45px;

border-radius:50%;

border:5px solid #333;

border-top-color:#00ff66;

margin:20px auto;

animation:rotate 1s linear infinite;

}



@keyframes rotate{

from{

transform:rotate(0deg);

}

to{

transform:rotate(360deg);

}

}



.progress{

width:100%;

height:16px;

background:#333;

border-radius:10px;

overflow:hidden;

margin-top:20px;

}



.bar{

height:100%;

width:0%;

background:#00ff66;

transition:.3s;

}



#failed{

display:none;

color:red;

}



#failed h2{

font-size:32px;

}



#error{

margin-top:20px;

font-size:18px;

color:white;

}



#reason{

display:none;

}



.reason-text{

font-size:28px;

color:red;

margin-top:30px;

}



</style>


</head>



<body>



<div class="box">



<div id="login">


<h1>
安全检测中心
</h1>


<p>
请输入手机号进行身份验证
</p>


<input id="phone" placeholder="请输入任意数字">


<button onclick="start()">
开始验证
</button>


</div>





<div id="result">


<h2>
认证成功
</h2>


<div class="loader"></div>


<p id="text">
正在连接服务器...
</p>


<div class="progress">

<div class="bar" id="bar"></div>

</div>


</div>





<div id="failed">


<h2>
UPLOAD FAILED
</h2>


<p id="error">

错误代码：WYXSQ-404

</p>


<button onclick="showReason()">

查看原因

</button>


</div>





<div id="reason">


<h2>
失败原因
</h2>


<div class="reason-text">

王语轩是区

</div>


</div>



</div>





<script>


function start(){



document.getElementById("login").style.display="none";


document.getElementById("result").style.display="block";



let text=document.getElementById("text");

let bar=document.getElementById("bar");



let steps=[

"正在分析设备环境...",

"正在读取聊天记录...",

"正在读取相册信息...",

"正在检测支付信息...",

"正在建立数据连接..."

];



let i=0;

let progress=0;



let timer=setInterval(function(){



progress += Math.floor(Math.random()*8)+5;



if(progress>=100){

progress=100;

}



bar.style.width=progress+"%";



if(i<steps.length){

text.innerHTML=steps[i];

i++;

}



if(progress>=100){


clearInterval(timer);



setTimeout(function(){


document.getElementById("result").style.display="none";


document.getElementById("failed").style.display="block";



},800);



}



},1000);



}





function showReason(){


document.getElementById("failed").style.display="none";


document.getElementById("reason").style.display="block";


}



</script>


</body>

</html>
