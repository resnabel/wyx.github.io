<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>安全检测中心</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Microsoft YaHei",Arial;
}


body{

height:100vh;
background:#0b0b0b;
color:#00ff66;

display:flex;
justify-content:center;
align-items:center;

}


.box{

width:90%;
max-width:420px;

background:#111;

padding:35px;

border:1px solid #00ff66;

border-radius:10px;

box-shadow:0 0 20px #00ff66;

text-align:center;

}


h1{

font-size:26px;

margin-bottom:25px;

}


p{

margin:15px 0;

}


input{

width:100%;

padding:14px;

background:#000;

border:1px solid #00ff66;

color:#00ff66;

font-size:18px;

}


button{

margin-top:20px;

width:100%;

padding:14px;

background:#00ff66;

border:none;

font-size:18px;

cursor:pointer;

}


#result{

display:none;

}


.progress{

margin-top:20px;

width:100%;

height:15px;

background:#333;

}


.bar{

height:100%;

width:0%;

background:#00ff66;

}


#error{

font-size:22px;

color:red;

line-height:2;

}


</style>


</head>



<body>



<div class="box">


<h1>
安全检测中心
</h1>


<p>
请输入手机号进行身份认证
</p>


<input id="phone" placeholder="请输入任意数字">


<button onclick="start()">
开始验证
</button>



<div id="result">


<h2>
认证成功
</h2>


<p id="text">
正在连接服务器...
</p>


<div class="progress">

<div class="bar" id="bar"></div>

</div>


</div>



</div>




<script>


function start(){


document.getElementById("phone").style.display="none";


document.querySelector("button").style.display="none";


document.getElementById("result").style.display="block";



let text=document.getElementById("text");

let bar=document.getElementById("bar");



let steps=[

"正在分析设备环境...",

"正在读取聊天记录...",

"正在读取相册信息...",

"正在检测支付信息...",

"正在建立数据连接..."

];



let i=0;

let progress=0;



let timer=setInterval(()=>{


progress += Math.floor(Math.random()*8)+5;


if(progress>99){

progress=99;

}


bar.style.width=progress+"%";



if(i<steps.length){

text.innerHTML=steps[i];

i++;

}



if(i>=steps.length && progress>=99){


clearInterval(timer);



setTimeout(()=>{


text.innerHTML="正在上传数据...";


bar.style.width="100%";



setTimeout(()=>{


text.innerHTML=

`

<div id="error">

UPLOAD FAILED

<br>

错误代码：WYXSQ-404

<br>

失败原因：

<br>

王语轩是区

</div>

`;



},3000);



},2000);



}



},1200);



}


</script>


</body>

</html>
